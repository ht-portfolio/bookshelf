<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>書籍登録</title>
        <style>
            .form-row {
                margin-bottom: 2px;
            }
            .form-row label {
                display: inline-block;
                width: 80px;
            }
        </style>
    </head>
    <body>
        <h1>書籍登録</h1>
        {% if errors %}
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <form method="POST">
            <div class="form-row">
                <label for="isbn">ISBN</label>
                <input
                    type="text"
                    id  ="isbn"
                    name="isbn"
                    maxlength = "20"
                    value = "{{ form_data.get('isbn', '') }}"
                >
            </div>
            <div class="form-row">
                <label for="title">書名</label>
                <input
                    type="text"
                    id  ="title"
                    name="title"
                    maxlength ="200"
                    required
                    value = "{{ form_data.get('title', '') }}"
                >
            </div>
            <div class="form-row">
                <label for="author">著者</label>
                <input
                    type="text"
                    id  ="author"
                    name="author"
                    maxlength ="200"
                    value = "{{ form_data.get('author', '') }}"
                >
            </div>
            <div class="form-row">
                <label for="publisher">出版社</label>
                <input
                    type="text"
                    id  ="publisher"
                    name="publisher"
                    maxlength="200"
                    value="{{ form_data.get('publisher', '') }}"
                >
            </div>
            <div class="form-row">
                <label for="published_date">出版日</label>
                <input
                    type="date"
                    id  ="published_date"
                    name="published_date"
                    maxlength="200"
                    value="{{ form_data.get('publisher', '') }}"
                >
            </div>
            <div class="form-row">
                <label for="status">読書状態</label>
                <select id="status" name="status">
                    <option
                        value="0"
                        {% if form_data.get('status', '0') == '0' %}selected{% endif %}
                    >
                        未読
                    </option>
                    <option
                        value="1"
                        {% if form_data.get('status', '0') == '1' %}selected{% endif %}
                    >
                        読書中</option>
                    <option
                        value="2"
                        {% if form_data.get('status', '0') == '2' %}selected{% endif %}
                    >
                        読了
                    </option>
                </select>
            </div>
            <div class="form-row">
                <label for="memo">メモ</label>
                <textarea 
                    id  ="memo"
                    name="memo"
                    maxlength="2000"
                >{{ form_data.get('memo', '') }}</textarea>
            </div>
            <div>
                <button type="submit">登録</button>
            </div>
            <div>
                <a href="/books">詳細画面へ戻る</a>
            </div>
        </form>
    </body>
</html>
